name: Node.js CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Check Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with: &setup-node-with
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - parallel:
          - name: Oxlint
            run: npm run lint:oxlint
          - name: Oxfmt
            run: npm run lint:oxfmt

  build:
    name: Build Action Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with: *setup-node-with
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload Action Assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist
          include-hidden-files: true

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to use OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with: *setup-node-with
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: >
          npm test --
          --experimental-test-coverage
          --test-coverage-include=src/*.ts
          --test-reporter=lcov
          --test-reporter-destination=coverage.lcov

      - name: Report Code Coverage to codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true

  integration-test:
    name: Integration Test
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-24.04 # ubuntu-latest
          - ubuntu-22.04
          - ubuntu-slim
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-26 # macos-latest
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - windows-2025 # windows-latest
          - windows-2022
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Action Assets
        uses: actions/download-artifact@v8.0.1
        with: &download-dist-artifact
          name: dist
          path: dist

      - name: Execute GitHub Action
        uses: ./
        with:
          image-url: ${{ vars.LGTM_IMAGE_URI }}

  diff:
    name: Compare Build Assets
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Release Branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          sparse-checkout: dist
      - name: Enable Corepack
        run: corepack enable

      - name: Download Current Action Assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: current

      - name: Get oxfmt version from package-lock.json
        id: version
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          VERSION=$(git show FETCH_HEAD:package-lock.json | jq -r '.packages["node_modules/oxfmt"].version')
          echo "oxfmt=$VERSION" >> $GITHUB_OUTPUT
      - name: Format minified js files for comparison
        run: |
          npm install --global "oxfmt@${{ steps.version.outputs.oxfmt }}"
          oxfmt dist/ current/
      - name: Compare
        id: compare
        continue-on-error: true
        run: git diff --no-index ./dist/ ./current/ > $RUNNER_TEMP/diff.txt

      - parallel:
          - name: Report Summary
            if: steps.compare.outcome == 'failure'
            run: |
              echo '# Compare ${{ github.sha }} to ${{ github.base_ref }}' >> $GITHUB_STEP_SUMMARY
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              cat $RUNNER_TEMP/diff.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
          - name: Report diff
            if: steps.compare.outcome == 'failure'
            run: |
              echo "::warning::${MESSAGE}"
              gh pr comment "$PR_URL" --body "${MESSAGE} [Show More](${RUN_URL})"
            env:
              GH_TOKEN: ${{ github.token }}
              PR_URL: ${{ github.event.pull_request.html_url }}
              MESSAGE: 'There is a difference in the build results.'
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    name: Deploy to Release branch
    if: github.event_name == 'push'
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Release Branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Restore Documents from ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin +${{ github.ref }}:refs/remotes/origin/${{ github.ref_name }}
          if [ -z "$RELEASE_FILES" ]; then
            echo "::error::RELEASE_FILES is not set or empty. Aborting deploy to avoid clearing the release branch without restoring files."
            exit 1
          fi
          git rm -r --force --quiet -- . ':!.gitignore'
          while IFS= read -r pattern; do
            pattern="${pattern%$'\r'}"
            [ -z "$pattern" ] && continue
            git restore --source=origin/${{ github.ref_name }} -- "$pattern" || true
          done <<< "$RELEASE_FILES"
        env:
          # A newline-separated list of file patterns to restore.
          # Example:
          #   *.md
          #   LICENSE
          #   action.yml
          RELEASE_FILES: ${{ vars.RELEASE_FILES }}

      - name: Download Build Assets
        uses: actions/download-artifact@v8.0.1
        with: *download-dist-artifact

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Commit and Push
        run: |
          git config user.name ${{ vars.GH_ACTIONS_COMMIT_NAME }}
          git config user.email ${{ vars.GH_ACTIONS_COMMIT_EMAIL }}
          git add .

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "build: deploy via ${{ github.sha }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:${{ vars.RELEASE_BRANCH }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
